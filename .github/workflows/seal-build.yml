name: Build and pack

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '0.10'
      - name: Build
        run: npm run build
      - name: Install npm 1.2.25
        run: npm i -g npm@1.2.25
      - name: Pack
        run: npm pack
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: jquery-1.11.1
          path: jquery-1.11.1.tgz
          if-no-files-found: error
